{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 text-center">
    <h1>Welcome Home</h1>
    {% if current_user.is_authenticated %}
        <p>Hi {{current_user.username}}! You are logged in.</p>
    {% else %}
        <p>Please <a href="{{url_for('login')}}">Login</a></p>
    {% endif %}
</div>
{% endblock %}
